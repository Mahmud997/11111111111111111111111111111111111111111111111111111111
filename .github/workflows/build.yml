
name: Wedingo Build

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Get source code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install frontend dependencies
        working-directory: frontend-guest
        run: npm install

      - name: Build frontend
        working-directory: frontend-guest
        run: npm run build

      - name: Save frontend build
        uses: actions/upload-artifact@v4
        with:
          name: wedingo-frontend-dist
          path: frontend-guest/dist/
          if-no-files-found: error
          retention-days: 7
