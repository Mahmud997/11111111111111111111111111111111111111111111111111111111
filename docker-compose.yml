version: '3.8'

services:
  mongo:
    image: mongo:7
    ports:
      - '27017:27017'
    volumes:
      - mongo_data:/data/db
    restart: unless-stopped

  # Optional: run backend inside Docker later
  # backend:
  #   build: ./backend
  #   ports:
  #     - '4000:4000'
  #   environment:
  #     - MONGO_URI=mongodb://mongo:27017/event-invitations
  #   depends_on:
  #     - mongo

volumes:
  mongo_data:
